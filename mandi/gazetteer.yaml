  - {id: ISLAMABAD, name_en: Islamabad, name_ur: "اسلام آباد", kind: CITY, district: Islamabad, province: Islamabad Capital Territory,
     lat: 33.693, lon: 73.064, aliases: {COMMON: [isb], MISSPELLING: [islamabaad]}}

# Designed-ambiguous aliases: the resolver must answer AMBIGUOUS and ask (file 03 §4.3).
ambiguous:
  crop:
    sabzi: [ONION, TOMATO, POTATO]
    sabziyan: [ONION, TOMATO, POTATO]
    "سبزی": [ONION, TOMATO, POTATO]
  place:
    khan: [DGKHAN, RYKHAN]
    "خان": [DGKHAN, RYKHAN]
