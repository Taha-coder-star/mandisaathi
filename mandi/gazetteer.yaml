# Crop + place gazetteer v0 (task 4.3; file 03 §3.2/§4, RFC §8; DECISIONS.md D-019).
# Load: python -m mandi.gazetteer (needs DATABASE_URL). The price loader loads it too.
# Aliases are stored normalised (mandi.gazetteer.norm); write them in any case/punctuation.
# name_en and name_ur are added as aliases automatically (crops: OFFICIAL / URDU_SCRIPT).
# Alias kinds = crop_alias.kind. place_alias has no kind column, so place alias kinds live only here.
# Only aliases under `ambiguous:` may name more than one target; any other collision fails the load.
version: v0

crops:
  ONION:
    name_en: Onion
    name_ur: "پیاز"
    perishability: MED          # ASSUMPTION (D-014)
    default_unit: mann
    covered: true
    aliases:
      COMMON: [pyaz]
      MISSPELLING: [piaz, payaz, pyaaz, piyaz]
      PUNJABI: [ganda, gandha, "گنڈا", "گنڈھا"]    # BELIEF · VERIFY (file 03 §4.2); گنڈھا = correct spelling (D-045)
      VOICE_STT: [piyaaz, pyaj, "प्याज"]
  TOMATO:
    name_en: Tomato
    name_ur: "ٹماٹر"
    perishability: HIGH         # ASSUMPTION (D-014)
    default_unit: mann
    covered: true
    aliases:
      COMMON: [tamatar]
      MISSPELLING: [timatar, tamater, tomatar, tamaatar]
      VOICE_STT: ["टमाटर"]
  POTATO:
    name_en: Potato
    name_ur: "آلو"
    perishability: MED          # ASSUMPTION (D-014)
    default_unit: mann
    covered: true
    aliases:
      COMMON: [aloo]
      MISSPELLING: [alu, aaloo, aalu]
      VOICE_STT: ["الو", "आलू"]                   # الو = آلو without madda (also "owl"; BELIEF, D-019)
  WHEAT:                        # F3 only; not a covered crop (file 10 §3/§5a, RFC §15)
    name_en: Wheat
    name_ur: "گندم"
    perishability: LOW          # ASSUMPTION (D-014)
    default_unit: mann
    covered: false
    aliases:
      COMMON: [gandum]
      MISSPELLING: [gandam]
      PUNJABI: [kanak, "کنک"]
      VOICE_STT: ["गेहूं"]
  COTTON:                       # here only so "kapas ka rate" is OUT_OF_COVERAGE (file 05 §4.1); perishability/unit ASSUMPTION, never shown
    name_en: Cotton
    name_ur: "کپاس"
    perishability: LOW
    default_unit: mann
    covered: false
    aliases:
      COMMON: [kapas, phutti]
      MISSPELLING: [kapaas]
  RICE:                         # same reason as COTTON
    name_en: Rice
    name_ur: "چاول"
    perishability: LOW
    default_unit: mann
    covered: false
    aliases:
      COMMON: [chawal]
      PUNJABI: [munji]          # paddy; BELIEF (D-019)

