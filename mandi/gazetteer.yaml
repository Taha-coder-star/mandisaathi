# Outside Punjab -> OUT_OF_COVERAGE (file 03 §4.3). Coordinates: Wikipedia coordinates API (en.wikipedia.org,
# prop=coordinates, redirects=1), fetched 2026-11-25, rounded to 3 dp. Hyderabad = article "Hyderabad, Pakistan".
other_places:
  - {id: HYDERABAD, name_en: Hyderabad, name_ur: "حیدرآباد", kind: CITY, district: Hyderabad, province: Sindh,
     lat: 25.379, lon: 68.368, aliases: {MISSPELLING: [haiderabad, hyderabad sindh], URDU_SCRIPT: ["حیدر آباد"]}}
  - {id: KARACHI, name_en: Karachi, name_ur: "کراچی", kind: CITY, district: Karachi, province: Sindh,
     lat: 24.860, lon: 67.010, aliases: {COMMON: [khi], MISSPELLING: [krachi]}}
  - {id: SUKKUR, name_en: Sukkur, name_ur: "سکھر", kind: CITY, district: Sukkur, province: Sindh,
     lat: 27.706, lon: 68.848, aliases: {MISSPELLING: [sukhar, sakhar]}}
  - {id: PESHAWAR, name_en: Peshawar, name_ur: "پشاور", kind: CITY, district: Peshawar, province: Khyber Pakhtunkhwa,
     lat: 34.014, lon: 71.568, aliases: {MISSPELLING: [pishawar, peshawer]}}
  - {id: DIKHAN, name_en: Dera Ismail Khan, name_ur: "ڈیرہ اسماعیل خان", kind: CITY, district: Dera Ismail Khan,
     province: Khyber Pakhtunkhwa, lat: 31.831, lon: 70.902, aliases: {COMMON: [d i khan, di khan], URDU_SCRIPT: ["ڈی آئی خان"]}}
  - {id: QUETTA, name_en: Quetta, name_ur: "کوئٹہ", kind: CITY, district: Quetta, province: Balochistan,
