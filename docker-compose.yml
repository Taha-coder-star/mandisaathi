# Local/VM stack. Postgres and Caddy join in task 2.1.
x-app: &app
  build: .
  image: mandisaathi

services:
  web:
    <<: *app
    ports: ["8000:8000"]
  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
  batch:
    <<: *app
    command: ["python", "-m", "mandi.batch"]
    profiles: [batch]  # not started by `up`; run with: docker compose run --rm batch
