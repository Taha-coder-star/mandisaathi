[project]
name = "mandisaathi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "mandi*"]

[tool.ruff]
line-length = 135
target-version = "py312"
extend-exclude = ["plan3"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]  # pinned so a newer ruff in CI does not add rules

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
